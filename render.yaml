# Render blueprint (free plan). Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: mami
    runtime: python
    plan: free               # $0. Sleeps when idle; cron-job.org pings /cron/tick to keep it awake
    region: frankfurt
    rootDir: backend
    buildCommand: pip install .
    # Migrations run before every start, so the schema is always current.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true   # Render creates a random secret; nothing for you to do
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_KEY
        generateValue: true   # used in the cron-job.org URL shown on /setup
      - key: WHOOP_CLIENT_ID
        sync: false
      - key: WHOOP_CLIENT_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true   # keep it stable: changing it means reconnecting WHOOP
